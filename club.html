<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0;url=https://apps.apple.com/fr/app/roll-finder/id6802250519">
<title>Fiche club — Roll Finder</title>
<meta name="description" content="Ouvre cette fiche club dans l'app Roll Finder.">
<link rel="canonical" href="https://approllfinder.com/club.html">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --accent: #2f6fed;
    --accent-soft: #eaf1fe;
    --on-accent: #ffffff;
    --bg: #f7f8fa;
    --surface: #ffffff;
    --text: #14171f;
    --text-muted: #5b6270;
    --border: #e6e8ee;
    --heading: 'Sora', -apple-system, sans-serif;
    --body: 'Inter', -apple-system, sans-serif;
    --shadow: 0 1px 2px rgba(20,23,31,0.04), 0 8px 24px rgba(47,111,237,0.06);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    font-family: var(--body);
    color: var(--text);
  }
  .wrap {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 380px;
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 32px 28px;
    text-align: center;
  }
  .icon {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    margin: 0 auto 20px;
    display: block;
  }
  h1 {
    font-family: var(--heading);
    font-size: 20px;
    margin: 0 0 8px;
  }
  p {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.5;
    margin: 0 0 24px;
  }
  .btn {
    display: inline-block;
    background: var(--accent);
    color: var(--on-accent);
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    padding: 13px 28px;
    border-radius: 12px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <img class="icon" src="/assets/apple-touch-icon.png" alt="Roll Finder" width="64" height="64">
      <h1>Ouverture de Roll Finder…</h1>
      <p>Cette fiche club s'ouvre dans l'app Roll Finder. Si tu n'as pas encore l'app, télécharge-la sur l'App Store.</p>
      <a class="btn" href="https://apps.apple.com/fr/app/roll-finder/id6802250519">Télécharger sur l'App Store</a>
    </div>
  </div>
  <script>
    location.replace('https://apps.apple.com/fr/app/roll-finder/id6802250519');
  </script>
</body>
</html>
